<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urbanity | Sign in</title>
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="auth.css">
  <script src="../api.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="hero-section" aria-label="Urbanity">
      <div class="hero-image"></div>
      <div class="hero-content"><div class="hero-logo"><svg class="hero-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg><h1 class="hero-title">Urbanity</h1></div><p class="hero-tagline">Community operations, made transparent.</p></div>
    </section>
    <section class="form-section">
      <div class="form-container">
        <header class="form-header"><h2>Sign in</h2><p>Use your Urbanity account to continue.</p></header>
        <div id="signinMessage" class="auth-message hidden" role="alert" aria-live="polite"></div>
        <form id="signinForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="signinEmail">Email address</label>
            <input type="email" id="signinEmail" class="form-input" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signinPassword">Password</label>
            <div class="password-field">
              <input type="password" id="signinPassword" class="form-input" autocomplete="current-password" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" data-password-toggle="signinPassword" aria-label="Show password" aria-pressed="false">
                <svg class="password-toggle-icon" data-password-visible-icon fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
                <svg class="password-toggle-icon hidden" data-password-hidden-icon fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m3 3 18 18M10.584 10.587A2 2 0 0 0 13.414 13.4M9.88 4.24A9.77 9.77 0 0 1 12 4c4.478 0 8.268 2.943 9.542 7a9.77 9.77 0 0 1-4.132 5.072M6.61 6.61A9.77 9.77 0 0 0 2.458 12C3.732 16.057 7.523 19 12 19c.847 0 1.67-.105 2.458-.301"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Sign in</button>
        </form>
        <p class="form-footer">Accounts are created by Urbanity administrators.</p>
      </div>
    </section>
  </main>
</body>
</html>
